services:
  db:
    image: postgres:17
    container_name: starter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-starter}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d starter" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    driver: local